<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="olbo">
  <defs>
    <clipPath id="icB-squircle"><rect x="0" y="0" width="1024" height="1024" rx="232"/></clipPath>
    <linearGradient id="icB-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1140"/>
      <stop offset="0.5" stop-color="#120A2C"/>
      <stop offset="1" stop-color="#0B0B0D"/>
    </linearGradient>
    <radialGradient id="icB-glow" cx="0.5" cy="0.46" r="0.6">
      <stop offset="0" stop-color="#7C5CFC" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#5B3FE0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5B3FE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icB-ring" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#A98CFF"/>
      <stop offset="0.5" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#5B3FE0"/>
    </linearGradient>
    <linearGradient id="icB-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="icB-neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.486  0 0 0 0 0.361 0 0 0 0 0.988  0 0 0 0.95 0"/>
    </filter>
  </defs>

  <g clip-path="url(#icB-squircle)">
    <rect width="1024" height="1024" fill="url(#icB-bg)"/>
    <rect width="1024" height="1024" fill="url(#icB-glow)"/>

    <circle cx="512" cy="512" r="230" fill="none" stroke="#7C5CFC" stroke-width="96" filter="url(#icB-neon)"/>

    <g>
      <circle cx="512" cy="512" r="230" fill="none" stroke="url(#icB-ring)" stroke-width="104" stroke-linecap="round"/>
      <circle cx="512" cy="512" r="230" fill="none" stroke="url(#icB-edge)" stroke-width="104" stroke-linecap="round" opacity="0.4"/>
      <path d="M362 380a230 230 0 0 1 300 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="16" stroke-linecap="round"/>
      <circle cx="512" cy="512" r="178" fill="none" stroke="#0B0B0D" stroke-opacity="0.35" stroke-width="4"/>
      <circle cx="512" cy="512" r="282" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

      <g fill="url(#icB-ring)">
        <rect x="473" y="412" width="78" height="200" rx="28"/>
        <rect x="412" y="473" width="200" height="78" rx="28"/>
        <rect x="473" y="412" width="78" height="200" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5"/>
        <rect x="412" y="473" width="200" height="78" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="5"/>
      </g>
    </g>

    <rect x="4" y="4" width="1016" height="1016" rx="228" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  </g>
</svg>
