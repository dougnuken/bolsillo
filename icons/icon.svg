<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="olbo">
  <!-- =========================================================
       olbo · Anillo Partido sobre la textura "Halo"

       EL SÍMBOLO: dos arcos idénticos que se deslizan uno sobre
       otro y no llegan a cerrar. Es la "o" de olbo y es plata que
       entra y plata que sale sin chocar. Va PLANO y de un solo
       tono a propósito: todo el color vive en el fondo, nunca
       dentro de la marca. Es lo que permite que siga leyéndose a
       29 px, donde un gradiente con glow se vuelve una mancha.
       Geometría: 2 arcos de 140°, radio 230, trazo 108, caps
       redondos, deslizados ±16 perpendicular al corte, rotados −28°.

       EL FONDO: cuatro losas anidadas que bajan en diagonal, con
       relleno degradado y canto luminoso, de casi negra la de
       fuera a violeta encendido la de dentro. Son las mismas del
       splash, reducidas de seis a cuatro: a 29 px los cantos
       desaparecen y queda solo el degradado diagonal, que es
       justo la profundidad que se busca. La esquina superior
       izquierda se deja oscura para que el símbolo blanco tenga
       dónde apoyarse.
       ========================================================= -->
  <defs>
    <clipPath id="sq"><rect width="1024" height="1024" rx="232"/></clipPath>
    <radialGradient id="bg" cx="0.74" cy="0.78" r="0.92">
      <stop offset="0" stop-color="#2A1E7E"/><stop offset=".18" stop-color="#221867"/>
      <stop offset=".36" stop-color="#19124B"/><stop offset=".54" stop-color="#110C32"/>
      <stop offset=".72" stop-color="#0C0820"/><stop offset="1" stop-color="#0A0519"/>
    </radialGradient>
    <linearGradient id="l1" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#0B0624"/><stop offset="1" stop-color="#1C1259"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#140C40"/><stop offset="1" stop-color="#2A1C86"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#1E1360"/><stop offset="1" stop-color="#3D28BE"/></linearGradient>
    <linearGradient id="l4" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#2A1A8E"/><stop offset="1" stop-color="#5538E8"/></linearGradient>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g stroke-width="4">
      <rect x="484" y="444" width="1100" height="1100" rx="187" fill="url(#l1)" stroke="#967CFF" stroke-opacity=".50" transform="rotate(-28 1034 994)"/>
      <rect x="594" y="544" width="880"  height="880"  rx="150" fill="url(#l2)" stroke="#AE96FF" stroke-opacity=".62" transform="rotate(-28 1034 984)"/>
      <rect x="704" y="644" width="660"  height="660"  rx="112" fill="url(#l3)" stroke="#C6B4FF" stroke-opacity=".74" transform="rotate(-28 1034 974)"/>
      <rect x="814" y="744" width="440"  height="440"  rx="75"  fill="url(#l4)" stroke="#DCD0FF" stroke-opacity=".85" transform="rotate(-28 1034 964)"/>
    </g>
    <g transform="rotate(-28 512 512)" fill="none" stroke="#FFFFFF" stroke-width="108" stroke-linecap="round">
      <path d="M295.9 417.3 A 230 230 0 0 1 728.1 417.3"/>
      <path d="M728.1 606.7 A 230 230 0 0 1 295.9 606.7"/>
    </g>
  </g>
</svg>
