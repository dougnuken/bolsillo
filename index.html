<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Seguridad -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' https://api.anthropic.com; img-src 'self' data: blob:; style-src 'self'; script-src 'self'" />

  <title>olbo</title>
  <meta name="description" content="olbo — tus finanzas personales, claras y en calma. Local-first." />

  <!-- PWA / iOS -->
  <link rel="manifest" href="./manifest.webmanifest?v=102" />
  <!-- ⚠️ v101 — NO subir este color para intentar "continuar" el morado bajo la
       isla dinámica. Probado en un 16 Pro Max: NO funciona.

       El intento fue poner aquí #261C61 (= --bg-app evaluado en su primera fila
       visible) con la teoría de que la franja se pintaba con este token y por
       eso cortaba. Falso. En standalone iOS NO usa theme-color para la barra de
       estado —eso es de Safari en modo navegador—: la franja la pinta el
       sistema a partir de `color-scheme: dark` + status-bar-style `default`.
       Que el negro coincidiera con el #0A0519 que había aquí era casualidad.

       Este token sigue en #0A0519 porque es lo que se ve en Safari-navegador,
       donde sí manda. -->
  <meta name="theme-color" content="#0A0519" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- ⚠️ NO CAMBIAR A `black-translucent`. Está probado en dispositivo, dos
       veces, y el resultado es siempre el mismo.

       EL TRADE-OFF, medido y cerrado:
         · `black-translucent` → el contenido pasa BAJO la barra de estado y el
           degradado sube hasta la isla dinámica. PERO en standalone, junto a
           viewport-fit=cover, WebKit deja el layout viewport en
           `pantalla − barra de estado` con el origen todavía en y=0: la ventana
           se estira por arriba y NO llega abajo. El hueco resultante mide justo
           la barra de estado — 62pt en un 16 Pro Max, que es exactamente
           env(safe-area-inset-top).
         · `default` → franja superior negra, pero el viewport llega al borde y
           el dock se apoya donde debe.
       No se pueden tener las dos. Doug eligió el dock.

       QUÉ SE DESCARTÓ POR EL CAMINO, para que nadie lo repita: el manifest
       (sonda A), el scroll de documento (sonda B — con ella cayó una migración
       de arquitectura que iba a tocar 28 acoplamientos), overscroll-behavior
       (sonda D), el JS de la app (sonda E), theme-color, reinstalar el ícono y
       la caché del Service Worker. Todo con sondas instaladas en el dispositivo.

       La holgura de 1px de la v69 (base.css + viewport.js) se queda, pero OJO:
       la v72 demostró que NO es ella la que suelta el viewport — con
       `black-translucent` y la holgura puesta, el hueco volvió igual. Manda
       este meta. La holgura no estorba y no se ha probado quitarla, pero no se
       le atribuya un mérito que no tiene. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="olbo" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

  <!-- Fuentes self-hosted (preload de la crítica) -->
  <link rel="preload" href="./fonts/plusjakarta-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Estilos — cache-buster versionado (?v=): iOS/WebKit cachea el CSS (max-age
       600) y la app instalada hereda el CSS que Safari ya tenía; una URL nueva
       (?v=N) fuerza fetch fresco sin depender de limpiar caché. Sube N en cada
       cambio de CSS junto con CACHE del sw.js. -->
  <link rel="stylesheet" href="./css/tokens.css?v=102" />
  <link rel="stylesheet" href="./css/base.css?v=102" />
  <link rel="stylesheet" href="./css/components.css?v=102" />
  <link rel="stylesheet" href="./css/views.css?v=102" />
  <link rel="stylesheet" href="./css/splash.css?v=102" />
</head>
<body>
  <!-- Splash de bienvenida: logo animado que se funde solo en el cold start. Ver css/splash.css -->
  <div id="splash" aria-hidden="true">
    <svg class="splash__icon" viewBox="0 0 120 120" role="img" aria-label="olbo">
      <defs>
        <linearGradient id="sp-ring" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#A98CFF" /><stop offset=".55" stop-color="#8B6CFF" /><stop offset="1" stop-color="#5B3FE0" />
        </linearGradient>
        <filter id="sp-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" /></filter>
      </defs>
      <circle cx="60" cy="60" r="40" fill="none" stroke="#7C5CFC" stroke-width="16" filter="url(#sp-glow)" opacity=".65" />
      <circle cx="60" cy="60" r="40" fill="none" stroke="url(#sp-ring)" stroke-width="14" />
      <circle class="splash__trace" cx="60" cy="60" r="40" fill="none" stroke="#EAE3FF" stroke-width="14" stroke-linecap="round" opacity=".5" transform="rotate(-90 60 60)" />
      <g class="splash__plus" fill="url(#sp-ring)">
        <rect x="55" y="42" width="10" height="36" rx="4" />
        <rect x="42" y="55" width="36" height="10" rx="4" />
      </g>
    </svg>
    <div class="splash__word">olbo</div>
    <div class="splash__tag">Tu riqueza en calma</div>
  </div>

  <div class="app-shell">

    <!-- Header (respeta notch / Dynamic Island) -->
    <header class="app-header">
      <h2 class="app-header__title" id="header-title" aria-hidden="true"></h2>
      <button class="icon-btn icon-btn--notif" id="open-notif" type="button" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5"></path>
          <path d="M13.7 20a2 2 0 0 1-3.4 0"></path>
        </svg>
        <span class="notif-badge" id="notif-badge" hidden>0</span>
      </button>
    </header>

    <!-- Escenario de vistas (poblado por JS) -->
    <main class="view-stage" id="view-stage"></main>

    <!-- Barrido de vidrio: difumina lo que pasa por detrás de la barra flotante. -->
    <div class="nav-blur" aria-hidden="true"></div>

    <!-- Tab bar inferior + FAB (4 pestañas: Hoy · Personas · [FAB] · Movimientos · Perfil).
         Para re-mostrar/añadir una pestaña: su <button> aquí + su entrada en ROUTES (app.js). -->
    <nav class="tabbar tabbar--4" id="tabbar" aria-label="Navegación principal" role="tablist">
      <button class="tab" type="button" data-route="hoy" role="tab">
        <svg class="tab__ico tab__ico--line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8.5"/><path d="M10 20v-5h4v5"/></svg>
        <svg class="tab__ico tab__ico--fill" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.35 3.28 3.7 9.53A2 2 0 0 0 3 11.08V19a2 2 0 0 0 2 2h3.5v-4.6a3.5 3.5 0 0 1 7 0V21H19a2 2 0 0 0 2-2v-7.92a2 2 0 0 0-.7-1.55l-7.65-6.25a1 1 0 0 0-1.3 0Z"/></svg>
        <span class="tab__label">Hoy</span>
      </button>
      <button class="tab" type="button" data-route="personas" role="tab">
        <svg class="tab__ico tab__ico--line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3 3 0 0 1 0 5.6"/><path d="M17.5 13.6A5.5 5.5 0 0 1 20.5 19"/></svg>
        <svg class="tab__ico tab__ico--fill" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M9 12.3c-3.2 0-5.7 2.1-5.7 5 0 .8.6 1.2 1.3 1.2h8.8c.7 0 1.3-.4 1.3-1.2 0-2.9-2.5-5-5.7-5Z"/><circle cx="16.6" cy="8.6" r="2.5"/><path d="M16.6 12.5c-.6 0-1.15.1-1.65.3 1.25 1.05 2.05 2.55 2.15 4.25.01.2 0 .4-.03.6H20c.65 0 1.15-.35 1.15-1.1 0-2.35-1.9-4.25-4.55-4.25Z"/></svg>
        <span class="tab__label">Personas</span>
      </button>
      <span aria-hidden="true"></span>
      <button class="tab" type="button" data-route="movimientos" role="tab">
        <svg class="tab__ico tab__ico--line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8h13M7 8l3-3M7 8l3 3"/><path d="M17 16H4M17 16l-3-3M17 16l-3 3"/></svg>
        <svg class="tab__ico tab__ico--fill" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 7.5a1 1 0 0 1 1-1h9.6l-1.8-1.8a1 1 0 0 1 1.4-1.42l3.5 3.5a1 1 0 0 1 0 1.44l-3.5 3.5a1 1 0 0 1-1.4-1.42l1.8-1.8H6a1 1 0 0 1-1-1Z"/><path d="M19 16.5a1 1 0 0 1-1 1H8.4l1.8 1.8a1 1 0 0 1-1.4 1.42l-3.5-3.5a1 1 0 0 1 0-1.44l3.5-3.5a1 1 0 0 1 1.4 1.42l-1.8 1.8H18a1 1 0 0 1 1 1Z"/></svg>
        <span class="tab__label">Movimientos</span>
      </button>
      <button class="tab" type="button" data-route="perfil" role="tab">
        <svg class="tab__ico tab__ico--line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="2.6"/><path d="M7.4 17.6a4.7 4.7 0 0 1 9.2 0"/></svg>
        <svg class="tab__ico tab__ico--fill" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M12 13.3c-3.9 0-7 2.5-7 5.6 0 .7.5 1.1 1.1 1.1h11.8c.6 0 1.1-.4 1.1-1.1 0-3.1-3.1-5.6-7-5.6Z"/></svg>
        <span class="tab__label">Perfil</span>
      </button>
    </nav>

    <!-- Velo para descartar el abanico del FAB tocando fuera -->
    <div class="fab-veil" id="fab-veil" aria-hidden="true"></div>

    <!-- Burbujas que nacen del + (gasto ↓ rojo / ingreso ↑ verde) -->
    <button class="fab-bubble fab-bubble--gasto" id="fab-gasto" type="button" aria-label="Registrar gasto" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </button>
    <button class="fab-bubble fab-bubble--ingreso" id="fab-ingreso" type="button" aria-label="Registrar ingreso" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>

    <!-- FAB central: abre el abanico gasto/ingreso -->
    <button class="fab" id="fab" type="button" aria-label="Registrar movimiento" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- Bottom sheet: Registrar -->
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Registrar movimiento"></div>

  </div>

  <script type="module" src="./js/app.js?v=102"></script>
</body>
</html>
