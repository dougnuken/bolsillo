<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Seguridad -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'self' https://api.anthropic.com; img-src 'self' data: blob:; style-src 'self'; script-src 'self'" />

  <title>olbo</title>
  <meta name="description" content="olbo — tus finanzas personales, claras y en calma. Local-first." />

  <!-- PWA / iOS -->
  <link rel="manifest" href="./manifest.webmanifest?v=154" />
  <!-- ⚠️ v101 — NO subir este color para intentar "continuar" el morado bajo la
       isla dinámica. Probado en un 16 Pro Max: NO funciona.

       El intento fue poner aquí #261C61 (= --bg-app evaluado en su primera fila
       visible) con la teoría de que la franja se pintaba con este token y por
       eso cortaba. Falso. En standalone iOS NO usa theme-color para la barra de
       estado —eso es de Safari en modo navegador—: la franja la pinta el
       sistema a partir de `color-scheme: dark` + status-bar-style `default`.
       Que el negro coincidiera con el #0A0519 que había aquí era casualidad.

       olbo 2.0 (claro): theme-color = perla #F0EFF2, lo que se ve en
       Safari-navegador, donde sí manda. En standalone la franja la pinta iOS con
       color-scheme: light + status-bar-style default. -->
  <meta name="theme-color" content="#F0EFF2" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- ⚠️ NO CAMBIAR A `black-translucent`. Está probado en dispositivo, dos
       veces, y el resultado es siempre el mismo.

       EL TRADE-OFF, medido y cerrado:
         · `black-translucent` → el contenido pasa BAJO la barra de estado y el
           degradado sube hasta la isla dinámica. PERO en standalone, junto a
           viewport-fit=cover, WebKit deja el layout viewport en
           `pantalla − barra de estado` con el origen todavía en y=0: la ventana
           se estira por arriba y NO llega abajo. El hueco resultante mide justo
           la barra de estado — 62pt en un 16 Pro Max, que es exactamente
           env(safe-area-inset-top).
         · `default` → franja superior negra, pero el viewport llega al borde y
           el dock se apoya donde debe.
       No se pueden tener las dos. Doug eligió el dock.

       QUÉ SE DESCARTÓ POR EL CAMINO, para que nadie lo repita: el manifest
       (sonda A), el scroll de documento (sonda B — con ella cayó una migración
       de arquitectura que iba a tocar 28 acoplamientos), overscroll-behavior
       (sonda D), el JS de la app (sonda E), theme-color, reinstalar el ícono y
       la caché del Service Worker. Todo con sondas instaladas en el dispositivo.

       La holgura de 1px de la v69 (base.css + viewport.js) se queda, pero OJO:
       la v72 demostró que NO es ella la que suelta el viewport — con
       `black-translucent` y la holgura puesta, el hueco volvió igual. Manda
       este meta. La holgura no estorba y no se ha probado quitarla, pero no se
       le atribuya un mérito que no tiene. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="olbo" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

  <!-- Fuentes self-hosted (preload de la crítica) -->
  <link rel="preload" href="./fonts/urbanist-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Estilos — cache-buster versionado (?v=): iOS/WebKit cachea el CSS (max-age
       600) y la app instalada hereda el CSS que Safari ya tenía; una URL nueva
       (?v=N) fuerza fetch fresco sin depender de limpiar caché. Sube N en cada
       cambio de CSS junto con CACHE del sw.js. -->
  <link rel="stylesheet" href="./css/tokens.css?v=154" />
  <link rel="stylesheet" href="./css/base.css?v=154" />
  <link rel="stylesheet" href="./css/components.css?v=154" />
  <link rel="stylesheet" href="./css/views.css?v=154" />
  <link rel="stylesheet" href="./css/splash.css?v=154" />
</head>
<body>
  <!-- Splash de bienvenida: logo animado que se funde solo en el cold start. Ver css/splash.css -->
  <div id="splash" aria-hidden="true">
    <!-- Seis losas anidadas que entran en cascada por la diagonal. Van vacías a
         propósito: tamaño, color y tiempo viven en css/splash.css. -->
    <div class="splash__losas"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="splash__grain"></div>
    <div class="splash__lock">
      <!-- LOCKUP EN DOS TIEMPOS
           El símbolo entra grande y solo, y cuando "lbo" se revela se encoge a
           talla de letra y cede el centro. No aparece una segunda "o": el
           símbolo ES la primera letra de la palabra, así que el logotipo no
           acompaña a la marca, la completa.

           Los dos grupos viven en el mismo viewBox, así que el kerning entre el
           símbolo y la "l" es una distancia dibujada y no una suma de anchos en
           px. El símbolo va a escala 0.3811: iguala su extensión real —anillo
           más el deslizamiento de los arcos, 600 u— con la "o" del wordmark más
           un 3% de overshoot óptico, que es lo que una curva necesita para
           pesar igual que un asta recta.

           Espaciado: b|o 24 < o|l 40 < l|b 48. Dos curvas se acercan más que
           curva y recta, y estas más que dos astas. Las astas cierran en −23
           porque su cap redondo de radio 23 lleva la tinta justo a la línea
           base; son las "o" las que la rebasan 6 u. -->
      <svg class="splash__lockup" viewBox="-32 -349 898 384" role="img" aria-label="olbo">
        <g class="lk-o">
          <g transform="translate(105.1,-105) scale(0.3811) translate(-512,-512)">
            <g transform="rotate(-28 512 512)" fill="none" stroke="currentColor" stroke-width="108" stroke-linecap="round">
              <path d="M295.9 417.3 A 230 230 0 0 1 728.1 417.3" />
              <path d="M728.1 606.7 A 230 230 0 0 1 295.9 606.7" />
            </g>
          </g>
        </g>
        <g class="lk-rest" fill="none" stroke="currentColor" stroke-width="46" stroke-linecap="round">
          <path d="M279 -300 V -23" />
          <path d="M373 -300 V -23" />
          <circle cx="484" cy="-105" r="88" />
          <path d="M811.6 -138 A 88 88 0 1 1 763 -186.6" />
        </g>
      </svg>
      <div class="splash__tag">Tu riqueza en calma</div>
    </div>
  </div>

  <div class="app-shell">

    <!-- Header (respeta notch / Dynamic Island) -->
    <header class="app-header">
      <h2 class="app-header__title" id="header-title" aria-hidden="true"></h2>
      <!-- Solo en Hoy: al colapsarse, el header se pone la marca en vez de
           repetir el saludo. El saludo es de la persona y ya vive en el hero;
           el chrome es de la app. Mismo Anillo Partido del splash y del ícono:
           plano y de un solo tono, que es lo que aguanta 22 px. -->
      <div class="hdr-marca hdr-hoy" aria-hidden="true">
        <svg class="hdr-marca__ico" viewBox="0 0 1024 1024" aria-hidden="true">
          <g transform="rotate(-28 512 512)" fill="none" stroke="currentColor" stroke-width="108" stroke-linecap="round">
            <path d="M295.9 417.3 A 230 230 0 0 1 728.1 417.3" />
            <path d="M728.1 606.7 A 230 230 0 0 1 295.9 606.7" />
          </g>
        </svg>
        <span class="hdr-marca__word">olbo</span>
      </div>
      <!-- Solo en Hoy: al colapsarse el hero, su orbe sube aquí. Es la acción
           distintiva de la app, así que es la que se queda a la vista. -->
      <button class="icon-btn hdr-hoy" id="hdr-orbe" type="button" aria-label="Tu conciencia financiera">
        <svg class="orbe" viewBox="212 212 600 600" aria-hidden="true"><g transform="rotate(-28 512 512)" fill="none" stroke-width="96" stroke-linecap="round" class="orbe__aro"><path d="M295.9 417.3A230 230 0 0 1 728.1 417.3"/><path d="M728.1 606.7A230 230 0 0 1 295.9 606.7"/></g><circle class="orbe__centro" cx="512" cy="512" r="62"/></svg>
      </button>
      <!-- Solo en Hoy: buscar y notificaciones se pliegan aquí. Hereda el badge
           para no perder el aviso al esconder la campana. -->
      <button class="icon-btn icon-btn--notif hdr-hoy" id="hdr-mas" type="button" aria-label="Más acciones">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
        <span class="notif-badge" hidden>0</span>
      </button>
      <button class="icon-btn icon-btn--notif" id="open-notif" type="button" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5"></path>
          <path d="M13.7 20a2 2 0 0 1-3.4 0"></path>
        </svg>
        <span class="notif-badge" id="notif-badge" hidden>0</span>
      </button>
    </header>

    <!-- Escenario de vistas (poblado por JS) -->
    <main class="view-stage" id="view-stage"></main>

    <!-- Barrido de vidrio: difumina lo que pasa por detrás de la barra flotante. -->
    <div class="nav-blur" aria-hidden="true"></div>

    <!-- Dock grafito (4 pestañas: Hoy · Personas · Movimientos · Perfil; el activo es una pill papel con etiqueta) + FAB esfera aparte, a la derecha.
         Para re-mostrar/añadir una pestaña: su <button> aquí + su entrada en ROUTES (app.js). -->
    <nav class="tabbar" id="tabbar" aria-label="Navegación principal" role="tablist">
      <button class="tab" type="button" data-route="hoy" role="tab" aria-selected="false" aria-label="Hoy">
        <svg class="tab__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-8.5"/><path d="M10 20v-5h4v5"/></svg>
        <span class="tab__label">Hoy</span>
      </button>
      <button class="tab" type="button" data-route="personas" role="tab" aria-selected="false" aria-label="Personas">
        <svg class="tab__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3 3 0 0 1 0 5.6"/><path d="M17.5 13.6A5.5 5.5 0 0 1 20.5 19"/></svg>
        <span class="tab__label">Personas</span>
      </button>
      <button class="tab" type="button" data-route="movimientos" role="tab" aria-selected="false" aria-label="Movimientos">
        <svg class="tab__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8h13M7 8l3-3M7 8l3 3"/><path d="M17 16H4M17 16l-3-3M17 16l-3 3"/></svg>
        <span class="tab__label">Movimientos</span>
      </button>
      <button class="tab" type="button" data-route="perfil" role="tab" aria-selected="false" aria-label="Perfil">
        <svg class="tab__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="2.6"/><path d="M7.4 17.6a4.7 4.7 0 0 1 9.2 0"/></svg>
        <span class="tab__label">Perfil</span>
      </button>
    </nav>

    <!-- Velo para descartar el abanico del FAB tocando fuera -->
    <div class="fab-veil" id="fab-veil" aria-hidden="true"></div>

    <!-- Burbujas papel que suben del + (Gasto ↓ / Ingreso ↑) -->
    <button class="fab-bubble fab-bubble--gasto" id="fab-gasto" type="button" aria-label="Registrar gasto" aria-hidden="true">
      <span class="fab-bubble__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>Gasto
    </button>
    <button class="fab-bubble fab-bubble--ingreso" id="fab-ingreso" type="button" aria-label="Registrar ingreso" aria-hidden="true">
      <span class="fab-bubble__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span>Ingreso
    </button>

    <!-- FAB central: abre el abanico gasto/ingreso -->
    <button class="fab" id="fab" type="button" aria-label="Registrar movimiento" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- Bottom sheet: Registrar -->
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Registrar movimiento"></div>

  </div>

  <script type="module" src="./js/app.js?v=154"></script>
</body>
</html>
